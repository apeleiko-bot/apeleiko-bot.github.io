<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровая визитка</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #B5B5B5;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1A1A1A;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 320px;
            border-left: 6px solid #D2FF00;
        }
        h1 {
            font-size: 22px;
            margin: 10px 0 5px 0;
            font-weight: 600;
        }
        .subtitle {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .company {
            color: #D2FF00;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #343e4c;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #4a5568;
        }
        .btn:hover {
    background-color: #D2FF00; /* При наведении кнопка становится лаймовой */
    color: #1A1A1A;            /* Текст становится темным */
    border-color: #D2FF00;
    transform: translateY(-2px);
}

        /* Главная кнопка для сохранения контакта */
        .btn-main {
            background-color: #D2FF00;
            color: #1A1A1A;
            border-color: #D2FF00;
            font-weight: bold;
        }
        .btn-main:hover {
            background-color: #bce600; /* Чуть более темный лайм при наведении */
            border-color: #bce600;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Андрей Тадеушевич Пелейко</h1>
    <div class="subtitle">Руководитель отдела продаж</div>
    <div class="company">Zrobat.by | Сервисная робототехника</div>
    
    <div class="links">
        <!-- Ссылка ведет на созданный нами файл contact.vcf -->
        <a href="contact.vcf" download class="btn btn-main">👤 Сохранить в контакты</a>
        <a href="tel:+375292550883" class="btn">📞 Позвонить</a>
        <a href="mailto:a.peleiko@zrobat.by" class="btn">✉️ Написать на email</a>
        <a href="https://zrobat.by" target="_blank" class="btn">🌐 Перейти на сайт</a>
    </div>
</div>

</body>
</html>
